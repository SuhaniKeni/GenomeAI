name: Render Deployment

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-to-render:
    name: Deploy to Render Cloud
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Verify CI Status
        run: |
          echo "=========================================="
          echo "All CI Checks Succeeded on Main Branch"
          echo "Triggering Production Deployment to Render"
          echo "=========================================="

      - name: Check Render Deploy Hook Secret
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is missing or empty!"
            echo "Please set RENDER_DEPLOY_HOOK in GitHub Repository Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          echo "✓ RENDER_DEPLOY_HOOK secret detected."

      - name: Trigger Render Deployment Hook
        run: |
          echo "Sending HTTP POST request to Render Deploy Hook..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
          
          if [ "$RESPONSE" -eq 250 ] || [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 201 ] || [ "$RESPONSE" -eq 202 ]; then
            echo "=========================================="
            echo "✓ Render Deploy Hook Triggered Successfully!"
            echo "HTTP Status Code: $RESPONSE"
            echo "=========================================="
          else
            echo "::error::Render Deploy Hook returned HTTP status code $RESPONSE"
            exit 1
          fi
