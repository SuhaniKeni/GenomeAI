name: Dependency Audit & Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. PYTHON PIP DEPENDENCY AUDIT
  # =========================================================================
  python-pip-audit:
    name: PyPI Vulnerability Audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit Vulnerability Scan
        run: |
          pip-audit -r requirements.txt --desc || echo "pip-audit completed with warnings."

  # =========================================================================
  # 2. NODE NPM DEPENDENCY AUDIT
  # =========================================================================
  node-npm-audit:
    name: NPM Dependency Audit (npm audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit Scan
        run: |
          cd frontend
          npm audit --audit-level=high || echo "npm audit detected vulnerabilities (non-blocking high level review)."

  # =========================================================================
  # 3. SECRET LEAKAGE SCANNING
  # =========================================================================
  secret-scan:
    name: Secret Leakage & Credentials Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Repository for Hardcoded Credentials & Tokens
        run: |
          python -c "
          import os, re, sys
          pattern = re.compile(r'BEGIN PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}')
          violations = []
          for root, dirs, files in os.walk('.'):
              if any(x in root for x in ['.git', '.venv', 'venv', 'node_modules', 'dist', '.pytest_cache']):
                  continue
              for f in files:
                  if f.endswith(('.py', '.js', '.jsx', '.html', '.json', '.yaml', '.yml', '.env.example', '.md')):
                      path = os.path.join(root, f)
                      try:
                          with open(path, 'r', encoding='utf-8', errors='ignore') as fp:
                              for idx, line in enumerate(fp, start=1):
                                  if pattern.search(line):
                                      violations.append(f'{path}:{idx}')
                      except Exception:
                          pass
          if violations:
              print('::error::Secrets or private keys detected in repository files:')
              for v in violations:
                  print(f'  - {v}')
              sys.exit(1)
          print('✓ Secret scanning completed: Zero hardcoded secrets detected.')
          "
