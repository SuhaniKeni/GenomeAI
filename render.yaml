# Render Infrastructure-as-Code Blueprint Configuration for GenomeAI
# Single-URL Web Application (React Frontend + FastAPI Backend) using Supabase PostgreSQL

services:
  - type: web
    name: genomeai
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GENOMEAI_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.2
      - key: ALLOWED_ORIGINS
        value: "*"

